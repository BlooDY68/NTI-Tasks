<div class="admin-wrapper">

  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <h2>⚙️ Admin Control</h2>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin/products" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="sidebar-link">
        📦 Products
      </a>
      <a routerLink="/admin/products/new" routerLinkActive="active" class="sidebar-link">
        ➕ Add New Product
      </a>
      <a routerLink="/admin/categories" routerLinkActive="active" class="sidebar-link">
        🏷️ Categories
      </a>
      <a routerLink="/admin/orders" routerLinkActive="active" class="sidebar-link">
        📋 Orders
      </a>
      <a routerLink="/admin/users" routerLinkActive="active" class="sidebar-link">
        👥 User Accounts
      </a>
    </nav>
  </aside>

  <main class="admin-content">
    <router-outlet></router-outlet>
  </main>
</div>
